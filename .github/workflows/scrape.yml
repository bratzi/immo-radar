name: scrape

# Muenchen-Miete (Spec 2026-11-11, Abschnitt 2 Entscheidung 5 und 11).
# Takt nach Tageszeit, Zeiten in UTC (Winterzeit: Berlin = UTC+1; im Sommer
# verschiebt sich alles um eine Stunde nach vorn, das ist hinnehmbar).
# Minuten krumm gewaehlt, weil GitHub zur vollen Stunde ueberlastet ist und
# geplante Laeufe nur nach bestem Bemuehen startet.
on:
  schedule:
    # Mo-Fr 8-14 Uhr Berlin: alle 15 min (Hausverwaltungen)
    - cron: "4,19,34,49 7-12 * * 1-5"
    # taeglich 18-23 Uhr Berlin: alle 15 min (Privatvermieter)
    - cron: "4,19,34,49 17-21 * * *"
    # sonst 7-23 Uhr Berlin: alle 30 min
    - cron: "4,34 6 * * *"
    - cron: "4,34 13-16 * * 1-5"
    - cron: "4,34 7-16 * * 0,6"
    # nachts: alle 2 h
    - cron: "4 22,0,2,4 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
        working-directory: scraper
      - run: npx playwright install --with-deps chromium
        working-directory: scraper
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # Sichtbarer Chromium (headless: false) unter virtuellem Display.
      - run: xvfb-run --auto-servernum npm run scrape
        working-directory: scraper
      # Routine "Reparatur": Bruch oder Dauersperre -> Issue; Bruch startet reparatur.yml.
      - name: Bruch pruefen
        if: always()
        working-directory: scraper
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/pruefe-brueche.mts
