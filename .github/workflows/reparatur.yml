name: reparatur

# Routine "Reparatur" (Spec docs/superpowers/specs/2026-11-12-routine-reparatur-design.md).
# Start: pruefe-brueche.mts per workflow_dispatch (Issues vom GITHUB_TOKEN loesen
# keine issues-Workflows aus) oder der Nutzer setzt das Label `reparatur` von Hand.
# Ergebnis: ein PR "Fixes #n", nie ein Merge. Kostet nur bei einem Bruch Token.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Nummer des Reparatur-Issues"
        required: true

concurrency:
  group: reparatur
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  reparatur:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'reparatur'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
    steps:
      - name: Secret pruefen
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY fehlt. Einmal unter Settings > Secrets > Actions anlegen; Erkennung und Issues laufen auch ohne."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
        working-directory: scraper
      - run: npx playwright install --with-deps chromium && sudo apt-get install -y xvfb
        working-directory: scraper
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm *),Bash(npx *),Bash(xvfb-run *),Bash(git *),Bash(gh *)"
          prompt: |
            Du reparierst den Scraper des Repos ${{ github.repository }}. Auftrag steht in Issue #${{ env.ISSUE }}
            (lies es mit `gh issue view ${{ env.ISSUE }}`); die Quelle steht im Titel "Reparatur: <quelle>".

            Regeln:
            1. Nur lesende Abrufe der Portalseite, keine Sperre, kein CAPTCHA und keine Bot-Erkennung umgehen.
               Ist die Seite gesperrt (403, CAPTCHA, DataDome), brich ab und kommentiere das im Issue.
            2. Hol die aktuelle Listenseite der Quelle: `cd scraper && xvfb-run --auto-servernum npx tsx scripts/pruefe-quelle.mts <quelle>`
               zeigt das Verhalten; die URL steht in `scraper/scrapers/<quelle>/index.ts`. Rohes HTML bei Bedarf mit einem kurzen
               Playwright-Skript (headless: false unter xvfb-run) nach fixtures-out/ holen.
            3. Parser in `scraper/scrapers/<quelle>/` anpassen, Fixture unter `scraper/test/fixtures/<quelle>/` ersetzen.
               Namen von Inserierenden und andere personenbezogene Daten aus der Fixture entfernen.
            4. Zuerst einen Test, der mit der neuen Fixture rot ist, dann der Fix, dann `npm test` und `npx tsc --noEmit` in scraper/.
            5. Branch `reparatur/<quelle>-${{ env.ISSUE }}`, Commit, Push, PR gegen main mit "Fixes #${{ env.ISSUE }}" im Text.
               Kein Merge. Schreib ins Issue, was kaputt war und was du geaendert hast.
