name: scrape

on:
  # PAUSIERT ab 2026-09-07 fuer den Umbau "vollstaendige Erfassung &
  # Bestandsfuehrung". Die Schema-Migration entfernt listings.is_active und
  # fuegt disappeared_at/sweep_runs hinzu -- der Code auf main kennt das neue
  # Schema noch nicht und wuerde bei jedem Lauf scheitern.
  # WIEDER AKTIVIEREN, sobald der Umbau gemerged ist.
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Was einen Lauf begrenzt:
    #  * Die beiden SWEEPS sind unbegrenzt -- sie MUESSEN vollstaendig sein,
    #    sonst faellt die Abgangserkennung ohnehin aus. Immowelt: rund 885
    #    Ergebnisseiten ueber 16 Bundeslaender, ZVG: rund 60. Bei 1 s
    #    Drosselung je Seite sind das ~15 min + ~1 min, plus Ladezeiten.
    #  * Die DETAILERFASSUNG ist je Quelle auf DETAIL_BUDGET_MS (12 min,
    #    scraper/main.ts) gedeckelt; der Rueckstand wandert in spaetere Laeufe.
    #    Also hoechstens 2 x 12 min = 24 min.
    # Summe: ~16 min Sweeps + 24 min Details + Abgleich/Meldungen. Ein
    # in-process Wanduhr-Limit gibt es nicht mehr (MAX_LAUFZEIT_MS ist mit dem
    # Umbau entfallen). Dieses Limit ist daher der einzige Notnagel -- und es
    # muss reichlich Luft lassen, denn es beendet den Job per SIGKILL: ein zu
    # knappes Limit wuerde den Abgleich am Laufende (Markieren, Karenz,
    # Loeschen) nie zur Ausfuehrung kommen lassen.
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
        working-directory: scraper
      - run: npx playwright install --with-deps chromium
        working-directory: scraper
      # xvfb explizit nachziehen: `playwright install --with-deps` bringt die
      # Chromium-Bibliotheken mit, aber nicht zwingend Xvfb selbst.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # Der Scraper faehrt Chromium bewusst headfull (headless: false), weil
      # Immowelts DataDome-Schutz Headless-Chromium mit HTTP 403 abweist.
      # Der GitHub-Runner hat keinen Bildschirm -- `xvfb-run` stellt ein
      # virtuelles Display bereit, sonst kann kein Fenstermodus starten.
      - run: xvfb-run --auto-servernum npm run scrape
        working-directory: scraper
